<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speak Or No Speak — simplified demo</title>
  <style>
    /* The only styles: super light gray background, dark gray text. */
    body {
      background: #fafafa;
      color: #333;
    }
  </style>
  <!-- Pinned CDN runtime libs — register the globals `ort` and `vad`,
       read by the Silero engine adapter at start() time. -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/bundle.min.js"></script>
  <!-- The SpeakOrNoSpeak IIFE bundle is injected by the loader at the end of
       <body>: the pinned CDN build by default, the repo build (`../build/`,
       same origin) with ?local=1 — so local src/ changes are testable from a
       local rebuild without a CDN push (WP-E0 0.5). -->
</head>

<body>
  <h1>Speak Or No Speak</h1>

  <p id="label" aria-live="polite">press start</p>

  <p>
    <button id="start">Start microphone</button>
  </p>

  <p>
    <input type="checkbox" id="smartTurn">
    <label for="smartTurn">Smart Turn (semantic end-of-turn, +8 MB)</label>
  </p>

  <p id="err"></p>

  <p>
    <button id="voice">Start voice</button>
  </p>

  <p>
    <label><input type="radio" name="voiceSrc" value="synth" checked> speechSynthesis</label>
    <label><input type="radio" name="voiceSrc" value="routed"> audio buffer (routed)</label>
    <small id="voiceNote"></small>
  </p>

  <script>
    const label = document.getElementById("label");
    const errEl = document.getElementById("err");
    const button = document.getElementById("start");
    const smartTurn = document.getElementById("smartTurn");
    const voice_button = document.getElementById("voice");
    const voiceNote = document.getElementById("voiceNote");

    // Bundle source: default stays the pinned CDN build; `?local=1` swaps in
    // the repo build (relative, same origin) for local testing (WP-E0 0.5).
    // NOTE: the canonical repo name is speak-or-no-speak-dev — jsdelivr's
    // default-branch URLs are cached ~12 h (s-maxage=43200); after pushing a
    // new build, purge via https://www.jsdelivr.com/tools/purge or wait it out.
    const BUNDLE_URL_CDN =
      "https://cdn.jsdelivr.net/gh/zushicat/speak-or-no-speak-dev/build/speak-or-no-speak.iife.js";
    const BUNDLE_URL_LOCAL = "../build/speak-or-no-speak.iife.js";
    const bundleSrc = new URLSearchParams(location.search).has("local")
      ? BUNDLE_URL_LOCAL
      : BUNDLE_URL_CDN;

    /** "The bundle script loaded but did not define the global" path. */
    function bundleFailedToLoad() {
      label.textContent = "bundle failed to load";
      errEl.textContent =
        "window.SpeakOrNoSpeak is missing — the IIFE bundle did not load from " + bundleSrc;
    }

    // Top-level (global lexical) binding — stays reachable from the page
    // console (`sons.setAgentSpeaking(true)`, `sons.degraded`, …), as the
    // baseline-matrix probes rely on (WP-E0 0.2).
    let sons = null;

    /** Page wiring — runs once the bundle script has loaded (onload). */
    function boot() {
      const bundle = window.SpeakOrNoSpeak;

      if (!bundle) {
        // The bundle <script> executed without defining the global: render,
        // never throw.
        bundleFailedToLoad();
        return;
      }

      const { createSpeakOrNoSpeak, humanMessage, SmartTurnModel, createAgentAudioRoute } = bundle;

      let micRunning = false;
      let micBusy = false;

      /** Cached across start/stop cycles — the ONNX session loads once. */
      let smartTurnModel = null;

      function setRunning(running) {
        micRunning = running;
        button.textContent = running ? "Stop microphone" : "Start microphone";
        button.setAttribute("aria-pressed", String(running));
        smartTurn.disabled = running;
      }

      async function toggleMicrophone() {
        if (micBusy) return;
        if (micRunning) {
          stopMicrophone();
          return;
        }
        micBusy = true;
        button.disabled = true;
        try {
          await startMicrophone();
        } finally {
          micBusy = false;
          button.disabled = false;
        }
      }

      async function startMicrophone() {
        errEl.textContent = "";
        label.textContent = "starting…";

        // Optional semantic end-of-turn model (checkbox; +8 MB asset). One
        // instance is cached so start/stop cycles do not reload the session.
        if (smartTurn.checked && !smartTurnModel) smartTurnModel = new SmartTurnModel();

        let instance = null;
        try {
          // WP5 §5.4 / WP-E1 acceptance: `?noaec=1` forces echoCancellation
          // off to exercise the "none"-scope branch on any machine.
          const forceNoAec = new URLSearchParams(location.search).has("noaec");
          const mic = forceNoAec ? { echoCancellation: false } : undefined;
          instance = await createSpeakOrNoSpeak({
            mic,
            turnModel: smartTurn.checked ? smartTurnModel : undefined,
            // WP-E1 D5 + WP-E3/E4 (D9) test hooks:
            //   `?strictgating=on|off` forces the stricter-gating rule,
            //   `?echogate=1` enables the coherence echo gate,
            //   `?voicegate=1` enables the agent-voice-profile gate
            //   (all default OFF).
            strictGating: new URLSearchParams(location.search).get("strictgating") ?? undefined,
            echoGate: new URLSearchParams(location.search).has("echogate")
              ? { enabled: true }
              : undefined,
            voiceGate: new URLSearchParams(location.search).has("voicegate")
              ? { enabled: true }
              : undefined,
            onSpeechStart: () => {
              label.textContent = "listening";
            },
            onTurnEnd: () => {
              label.textContent = "not listening";
            },
            onLevel: () => { },
            onError: onError,
            debug: false,
          });
          await instance.start();
          sons = instance;
          setRunning(true);
          label.textContent = "not listening";
          if (instance.degraded.aec) errEl.textContent = humanMessage("no-aec");
          if (instance.degraded.engine === "energy") {
            errEl.textContent = humanMessage("engine-fallback");
          }
          // WP-E1 (§1.6) + WP-E2: honest status line — engine + AEC scope.
          const aecScope = instance.degraded.aecScope;
          if (aecScope === "unknown" && !instance.degraded.aec) {
            errEl.textContent = humanMessage("aec-scope-limited");
          }
          if (aecScope) errEl.textContent += ` (engine: ${instance.degraded.engine} · aec scope: ${aecScope})`;

          // WP-E2: cancelable agent-audio route — created HERE inside the
          // mic-start click (user gesture, R2), reused while the mic runs,
          // stopped on mic stop. Fail-soft (R3): plain playback + stricter
          // gating stay active if the loopback cannot be built. `?routemode=`
          // forces loopback|direct (test hook, D7).
          if (typeof createAgentAudioRoute === "function") {
            try {
              const forced = new URLSearchParams(location.search).get("routemode");
              route = await createAgentAudioRoute(forced ? { mode: forced } : {});
              instance.setAgentAudioRouted(true);
              // WP-E3: the route is also the echo-reference data feed — the
              // correlation gate (if enabled via ?echogate=1) classifies the
              // mic frames against this reference.
              instance.setAgentAudioReference(route);
              voiceNote.textContent = ` · route: ${route.mode}`;
            } catch (routeErr) {
              route = null;
              errEl.textContent += ` · agent-audio route failed: ${routeErr?.message ?? routeErr}`;
            }
          } else {
            voiceNote.textContent = " · route: n/a (bundle without createAgentAudioRoute)";
          }
        } catch (err) {
          // onError may already have rendered the message; otherwise show it here.
          try { instance?.stop(); } catch { /* already torn down */ }
          sons = null;
          setRunning(false);
          label.textContent = "press start";
          errEl.textContent = err?.code
            ? humanMessage(err.code)
            : `Error: ${err?.message ?? err}`;
        }
      }

      function stopMicrophone() {
        try {
          sons?.setAgentAudioRouted(false); // D5: route declaration is per-session
          sons?.stop();
        } catch { /* already torn down */ }
        sons = null;
        setRunning(false);
        label.textContent = "press start";
        errEl.textContent = "";
        voiceNote.textContent = "";
        stopRoutedVoice();
        const r = route;
        route = null;
        r?.stop().catch(() => { /* teardown is best-effort */ });
      }

      function onError(err) {
        errEl.textContent = humanMessage(err.code) ?? `Error (${err.code}): ${err.message}`;
        // eslint-disable-next-line no-console
        console.error("[sons] onError:", err);
      }

      // Wiring
      button.addEventListener("click", toggleMicrophone);

      // Release the mic when the page is left (reload / bfcache).
      window.addEventListener("pagehide", () => {
        if (micRunning) stopMicrophone();
      });
    }

    // *******
    // computer voice — two sources (WP-E2):
    //   speechSynthesis: today's default; NOT cancelable on Chrome/Edge
    //     without `echoCancellation: "all"` + OS permission (F7 — cannot be
    //     captured into the AEC reference).
    //   audio buffer (routed): plays demo/agent-voice-sample.wav through the
    //     cancelable agent-audio route (createAgentAudioRoute) — the browser
    //     classifies it as "remote participant" audio and cancels it (D6/D8).
    // *******
    voice_button.addEventListener("click", toggleComputerVoice);
    let voice_running = false;
    const synth = window.speechSynthesis;
    let utterance = new SpeechSynthesisUtterance("Hello. I am happy that you talk to me. Tell me about your day. What have you been up to?");

    let route = null;        // created at mic start (user gesture), stopped at mic stop
    let routedSource = null; // active AudioBufferSourceNode (loop mode)
    let voiceBuffer = null;  // decoded agent-voice-sample.wav (decoded once)

    function selectedVoiceSource() {
      return document.querySelector('input[name="voiceSrc"]:checked')?.value ?? "synth";
    }

    async function ensureVoiceBuffer() {
      if (voiceBuffer) return voiceBuffer;
      const res = await fetch("agent-voice-sample.wav");
      if (!res.ok) throw new Error(`voice sample fetch failed (${res.status})`);
      const ab = await res.arrayBuffer();
      const decodeCtx = new AudioContext(); // one-off decode (route ctx is private by contract)
      try { voiceBuffer = await decodeCtx.decodeAudioData(ab); }
      finally { decodeCtx.close().catch(() => {}); }
      return voiceBuffer;
    }

    async function playRoutedVoice() {
      if (!route) throw new Error("route not ready — start the microphone first (the route is created in that click)");
      const buffer = await ensureVoiceBuffer();
      const src = route.input.context.createBufferSource();
      src.buffer = buffer;
      src.loop = true;
      src.connect(route.input); // the ONLY wiring (D8) — never also to ctx.destination
      src.start();
      routedSource = src;
    }

    function stopRoutedVoice() {
      try { routedSource?.stop(); } catch { /* already stopped */ }
      routedSource = null;
    }

    async function toggleComputerVoice() {
      voice_running = !voice_running;
      voice_button.textContent = voice_running ? "Stop voice" : "Start voice";

      if (voice_running) {
        if (selectedVoiceSource() === "routed") {
          try {
            await playRoutedVoice();
          } catch (err) {
            voice_running = false;
            voice_button.textContent = "Start voice";
            errEl.textContent = `Routed voice failed: ${err?.message ?? err}`;
          }
        } else {
          synth.speak(utterance);
        }
      }
      else {
        synth.cancel();
        stopRoutedVoice();
      }
    }

    // *******
    // bundle loader (replaces the former static CDN <script> tag)
    // *******
    const bundleScript = document.createElement("script");
    bundleScript.src = bundleSrc;
    bundleScript.onload = boot;
    bundleScript.onerror = bundleFailedToLoad;
    document.head.appendChild(bundleScript);
  </script>
</body>

</html>
