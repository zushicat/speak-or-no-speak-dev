<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Speak Or No Speak — WP1 smoke</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    code { background: #f2f2f2; padding: 0.1rem 0.3rem; border-radius: 4px; }
    #indicator {
      width: 8rem; height: 8rem; border-radius: 50%;
      background: #ff9800; /* orange = not listening (naive pre-WP2 check) */
      margin: 1rem 0; transition: background 0.15s;
    }
    #indicator.speech { background: #4caf50; } /* green = speech detected (D2) */
    #status { font-family: ui-monospace, monospace; white-space: pre-wrap; }
  </style>
  <!-- WP1 (D1): pinned CDN runtime libs — must load BEFORE our module script.
       They register the globals `ort` and `vad`, read only inside
       src/vad/silero-vad-adapter.js (single choke point). -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/bundle.min.js"></script>
</head>
<body>
  <h1>Speak Or No Speak</h1>
  <p>WP1 smoke page — frame probabilities from Silero VAD v5. The real
     green/orange demo page lands in WP2
     (<code>plans/initial/work-packages/wp2-demo-indicator-page.md</code>).</p>
  <div id="indicator"></div>
  <button id="start">Start microphone</button>
  <pre id="status"></pre>
  <script type="module" src="./demo/main.js"></script>
</body>
</html>
