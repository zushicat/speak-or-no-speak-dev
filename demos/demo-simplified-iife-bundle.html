<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <title>Speak Or No Speak — simplified demo</title>
  <style>
    /* The only styles: super light gray background, dark gray text. */
    body {
      background: #fafafa;
      color: #333;
    }
  </style>
  <!-- Pinned CDN runtime libs — register the globals `ort` and `vad`,
       read by the Silero engine adapter at start() time. -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/bundle.min.js"></script>
  <!-- The prebuilt IIFE bundle from the CDN: a classic <script>, no modules —
       it defines the global window.SpeakOrNoSpeak. -->
  <script src="https://cdn.jsdelivr.net/gh/zushicat/speak-or-no-speak-dev/build/speak-or-no-speak.iife.js"></script>
</head>

<body>
  <h1>Speak Or No Speak</h1>

  <p id="label" aria-live="polite">press start</p>

  <p>
    <button id="start">Start microphone</button>
  </p>

  <p>
    <input type="checkbox" id="smartTurn">
    <label for="smartTurn">Smart Turn (semantic end-of-turn, +8 MB)</label>
  </p>

  <p id="err"></p>

  <p>
    <button id="voice" aria-pressed="false">Start computer voice</button>
    <select id="voiceSrc" aria-label="Voice source">
      <option value="synth" selected>speechSynthesis</option>
      <option value="routed">audio buffer (routed)</option>
    </select>
    <select id="ttsVoice" aria-label="Speech synthesis voice">
      <option value="" selected>system default</option>
    </select>
    <small id="voiceNote"></small>
  </p>

  <!-- rev-11.1: minimal STT row — real endpoints via mode select
       (stub: raw WAV body → JSON · openai: multipart /v1/audio/transcriptions),
       model id, optional API key. Single-line output instead of a log. -->
  <p>
    <input type="checkbox" id="transcribe">
    <label for="transcribe">transcribe turns</label>
    <select id="sttMode" aria-label="STT backend mode">
      <option value="stub" selected>Stub (WAV body → JSON)</option>
      <option value="openai">OpenAI-compatible (multipart)</option>
    </select>
    <input id="sttEndpoint" value="http://localhost:6000/transcribe" size="32"
      placeholder="STT endpoint URL — stub: POST WAV → JSON · openai: …/v1/audio/transcriptions">
  </p>
  <p>
    <input id="sttModel" type="text" size="40" disabled autocomplete="off"
      aria-label="STT model id (OpenAI-compatible mode)"
      placeholder="model id (OpenAI-compatible mode only, e.g. mlx-community/parakeet-tdt-0.6b-v3)">
    <input id="sttApiKey" type="password" size="16" autocomplete="off" aria-label="STT API key (optional)"
      placeholder="API key (optional)">
  </p>
  <p id="sttOut" aria-live="polite"></p>

  <!--
    demo-simplified-iife-bundle.html — minimal version of demo-iife-bundle.html
    (docs/04-embedding.md §4.4 "Mode 3 — prebuilt IIFE bundle").

    Differences from demo-iife-bundle.html:
      - only styles are the page colors (super light gray bg, dark gray text)
      - no listening dot — plain text status only
      - no background-noise player, no event log — but a minimal STT row
        (rev-11.1: mode select + model + optional API key, single-line
        output, no settings persistence)
      - the library comes from the CDN (jsDelivr GitHub mirror), not ../../build/
      - computer-voice row (rev-9): start/stop button + voice-source select —
        same wiring as demo-simplified-voice-iife-bundle.html

    Run it (secure context required — file:// will not work):
        npm start        # python3 -m http.server 5173, serves the checkout root
        open http://localhost:5173/demos/simple-demos/demo-simplified-iife-bundle.html
    Because every asset is a https:// CDN URL, the page also works from any
    other static server root (or a host that serves only this one file).
  -->

  <!-- The entire consumer code — no modules, the global is the whole API. -->
  <script>
    const bundle = window.SpeakOrNoSpeak;

    const button = document.getElementById("start");
    const label = document.getElementById("label");
    const errEl = document.getElementById("err");
    const smartTurn = document.getElementById("smartTurn");
    const transcribeToggle = document.getElementById("transcribe");
    const sttMode = document.getElementById("sttMode");
    const sttEndpoint = document.getElementById("sttEndpoint");
    const sttModel = document.getElementById("sttModel");
    const sttApiKey = document.getElementById("sttApiKey");
    const sttOut = document.getElementById("sttOut");

    if (!bundle) {
      // The bundle <script> failed (offline / CDN down): render, never throw.
      label.textContent = "bundle failed to load";
      errEl.textContent =
        "window.SpeakOrNoSpeak is missing — the IIFE bundle did not load from " +
        "https://cdn.jsdelivr.net/gh/zushicat/speak-or-no-speak-dev/build/speak-or-no-speak.iife.js";
    } else {
      const { createSpeakOrNoSpeak, humanMessage, SmartTurnModel, CloudStubAdapter, encodeWav, createAgentAudioRoute } = bundle;

      // -------------------------------------------------------------------
      // rev-11.1: minimal STT wiring — stub mode reuses the bundle's
      // CloudStubAdapter (raw WAV body → { text, confidence? } JSON); openai
      // mode POSTs multipart (file + model) to an OpenAI-compatible
      // /v1/audio/transcriptions endpoint. Fire-and-forget from onTurnEnd —
      // failures land in the single output line, never in detection.
      // -------------------------------------------------------------------
      function transcribeTurn(audio) {
        if (!transcribeToggle.checked) return;
        const endpoint = sttEndpoint.value.trim();
        if (!endpoint) return;
        const mode = sttMode.value;
        const token = sttApiKey.value.trim() || undefined;
        let request;
        if (mode === "openai") {
          const form = new FormData();
          form.append("file", encodeWav(audio, 16000), "turn.wav");
          const model = sttModel.value.trim();
          if (model) form.append("model", model);
          const headers = {};
          if (token) headers.Authorization = `Bearer ${token}`;
          request = fetch(endpoint, { method: "POST", headers, body: form })
            .then(async (res) => {
              if (!res.ok) throw new Error(`STT endpoint responded ${res.status}`);
              const type = res.headers.get("Content-Type") ?? "";
              return type.includes("json") ? await res.json() : { text: (await res.text()).trim() };
            });
        } else {
          request = new CloudStubAdapter({ endpoint, token }).transcribe(audio);
        }
        request
          .then((t) => { sttOut.textContent = `💬 "${String(t.text ?? "")}" · ${mode}`; })
          .catch((err) => { sttOut.textContent = `STT failed (${mode}): ${err.message}`; });
      }

      let sons = null;
      let micRunning = false;
      let micBusy = false;

      /** Cached across start/stop cycles — the ONNX session loads once. */
      let smartTurnModel = null;

      // Computer voice (rev-9) — start/stop button + voice-source select.
      const voice = document.getElementById("voice");
      const voiceSrc = document.getElementById("voiceSrc");
      const ttsVoice = document.getElementById("ttsVoice");
      const voiceNote = document.getElementById("voiceNote");
      const synth = window.speechSynthesis;
      const utterance = new SpeechSynthesisUtterance("Hello. I am happy that you talk to me. Tell me about your day. What have you been up to?");

      let voiceRunning = false;
      let route = null;        // created at mic start (user gesture), stopped at mic stop
      let routedSource = null; // active AudioBufferSourceNode (loop mode)
      let voiceBuffer = null;  // decoded agent-voice-sample.wav (decoded once)

      function setRunning(running) {
        micRunning = running;
        button.textContent = running ? "Stop microphone" : "Start microphone";
        button.setAttribute("aria-pressed", String(running));
        smartTurn.disabled = running;
      }

      async function toggleMicrophone() {
        if (micBusy) return;
        if (micRunning) {
          stopMicrophone();
          return;
        }
        micBusy = true;
        button.disabled = true;
        try {
          await startMicrophone();
        } finally {
          micBusy = false;
          button.disabled = false;
        }
      }

      async function startMicrophone() {
        errEl.textContent = "";
        label.textContent = "starting…";

        // Optional semantic end-of-turn model (checkbox; +8 MB asset). One
        // instance is cached so start/stop cycles do not reload the session.
        if (smartTurn.checked && !smartTurnModel) smartTurnModel = new SmartTurnModel();

        let instance = null;
        try {
          instance = await createSpeakOrNoSpeak({
            turnModel: smartTurn.checked ? smartTurnModel : undefined,
            onSpeechStart: () => {
              label.textContent = "listening";
            },
            onTurnEnd: (e) => {
              label.textContent = "not listening";
              transcribeTurn(e.audio); // rev-11.1 plug point — never affects detection
            },
            onLevel: () => { },
            onError: onError,
            debug: false,
          });
          await instance.start();
          sons = instance;
          setRunning(true);
          label.textContent = "not listening";
          if (instance.degraded.aec) errEl.textContent = humanMessage("no-aec");
          if (instance.degraded.engine === "energy") {
            errEl.textContent = humanMessage("engine-fallback");
          }

          // WP-E2: cancelable agent-audio route — created HERE inside the
          // mic-start click (user gesture, R2), reused while the mic runs,
          // stopped on mic stop. Fail-soft (R3): plain playback + stricter
          // gating stay active if the loopback cannot be built. `?routemode=`
          // forces loopback|direct (test hook, D7).
          if (typeof createAgentAudioRoute === "function") {
            try {
              const forced = new URLSearchParams(location.search).get("routemode");
              route = await createAgentAudioRoute(forced ? { mode: forced } : {});
              instance.setAgentAudioRouted(true);
              instance.setAgentAudioReference(route);
              voiceNote.textContent = ` · route: ${route.mode}`;
            } catch (routeErr) {
              route = null;
              errEl.textContent += ` · agent-audio route failed: ${routeErr?.message ?? routeErr}`;
            }
          } else {
            voiceNote.textContent = " · route: n/a (bundle without createAgentAudioRoute)";
          }
        } catch (err) {
          // onError may already have rendered the message; otherwise show it here.
          try { instance?.stop(); } catch { /* already torn down */ }
          sons = null;
          setRunning(false);
          label.textContent = "press start";
          errEl.textContent = err?.code
            ? humanMessage(err.code)
            : `Error: ${err?.message ?? err}`;
        }
      }

      function stopMicrophone() {
        try {
          sons?.setAgentAudioRouted(false); // D5: route declaration is per-session
        } catch { /* already torn down */ }
        try {
          sons?.stop();
        } catch { /* already torn down */ }
        sons = null;
        setRunning(false);
        label.textContent = "press start";
        errEl.textContent = "";
        voiceNote.textContent = "";
        stopComputerVoice();
        const r = route;
        route = null;
        r?.stop().catch(() => { /* teardown is best-effort */ });
      }

      function onError(err) {
        errEl.textContent = humanMessage(err.code) ?? `Error (${err.code}): ${err.message}`;
        // eslint-disable-next-line no-console
        console.error("[sons] onError:", err);
      }

      // ---------------------------------------------------------------------
      // Computer voice — two sources (WP-E2):
      //   speechSynthesis: today's default; NOT cancelable on Chrome/Edge
      //     without `echoCancellation: "all"` + OS permission (F7 — cannot be
      //     captured into the AEC reference).
      //   audio buffer (routed): plays demo/agent-voice-sample.wav through the
      //     cancelable agent-audio route (createAgentAudioRoute) — the browser
      //     classifies it as "remote participant" audio and cancels it (D6/D8).
      //   voice dropdown (ttsVoice): the system TTS voices from
      //     speechSynthesis.getVoices() — applies to the synth source only.
      // ---------------------------------------------------------------------

      function setVoiceUi(running) {
        voiceRunning = running;
        voice.textContent = running ? "Stop computer voice" : "Start computer voice";
        voice.setAttribute("aria-pressed", String(running));
      }

      /** Apply the TTS voice picked in the voice dropdown (unset = system
       *  default). The utterance must get the SpeechSynthesisVoice OBJECT —
       *  looked up from the live getVoices() list at speak time. */
      function applySelectedVoice(u) {
        const selected = ttsVoice.value
          ? synth.getVoices().find((v) => v.voiceURI === ttsVoice.value)
          : null;
        u.voice = selected ?? null;
        u.lang = selected ? selected.lang : ""; // "" = user-agent default language
      }

      /** Populate the voice dropdown from speechSynthesis.getVoices() — the
       *  list arrives async in Chrome (voiceschanged) and can change; the
       *  user's choice survives repopulation. */
      function populateTtsVoices() {
        const voices = synth.getVoices();
        if (!voices.length) return;
        const previous = ttsVoice.value;
        ttsVoice.textContent = "";
        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.textContent = "system default";
        ttsVoice.appendChild(defaultOption);
        for (const v of voices) {
          const option = document.createElement("option");
          option.value = v.voiceURI;
          option.textContent = `${v.name} (${v.lang})`;
          ttsVoice.appendChild(option);
        }
        if ([...ttsVoice.options].some((o) => o.value === previous)) ttsVoice.value = previous;
      }
      populateTtsVoices();
      synth.addEventListener("voiceschanged", populateTtsVoices);

      async function ensureVoiceBuffer() {
        if (voiceBuffer) return voiceBuffer;
        const res = await fetch("agent-voice-sample.wav");
        if (!res.ok) throw new Error(`voice sample fetch failed (${res.status})`);
        const ab = await res.arrayBuffer();
        const decodeCtx = new AudioContext(); // one-off decode (route ctx is private by contract)
        try { voiceBuffer = await decodeCtx.decodeAudioData(ab); }
        finally { decodeCtx.close().catch(() => { }); }
        return voiceBuffer;
      }

      async function playRoutedVoice() {
        if (!route) throw new Error("route not ready — start the microphone first (the route is created in that click)");
        const buffer = await ensureVoiceBuffer();
        const src = route.input.context.createBufferSource();
        src.buffer = buffer;
        src.loop = true;
        src.connect(route.input); // the ONLY wiring (D8) — never also to ctx.destination
        src.start();
        routedSource = src;
      }

      function stopRoutedVoice() {
        try { routedSource?.stop(); } catch { /* already stopped */ }
        routedSource = null;
      }

      function stopComputerVoice() {
        setVoiceUi(false);
        synth.cancel();
        stopRoutedVoice();
      }

      async function toggleComputerVoice() {
        if (voiceRunning) {
          stopComputerVoice();
          return;
        }
        setVoiceUi(true);

        if (voiceSrc.value === "routed") {
          try {
            await playRoutedVoice();
          } catch (err) {
            setVoiceUi(false);
            errEl.textContent = `Routed voice failed: ${err?.message ?? err}`;
          }
        } else {
          applySelectedVoice(utterance);
          synth.speak(utterance);
        }
      }

      // Wiring
      button.addEventListener("click", toggleMicrophone);
      voice.addEventListener("click", toggleComputerVoice);

      // rev-11.1: the model field only applies to the OpenAI-compatible backend.
      sttModel.disabled = sttMode.value !== "openai";
      sttMode.addEventListener("change", () => {
        sttModel.disabled = sttMode.value !== "openai";
      });

      // Release the mic when the page is left (reload / bfcache).
      window.addEventListener("pagehide", () => {
        if (micRunning) stopMicrophone();
      });
    }
  </script>
</body>

</html>
