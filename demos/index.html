<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <title>Speak Or No Speak — demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #9ca3af;
      color: #eee;
    }

    .card {
      text-align: center;
    }

    #dot {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 16px;
      background: #f59e0b;
      transition: background 150ms;
    }

    body.listening #dot {
      background: #22c55e;
    }

    #label {
      font-size: 28px;
    }

    button {
      margin-top: 24px;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: 0;
      cursor: pointer;
    }

    input[type="checkbox"] {
      appearance: none;
      border-radius: 20px;
      border: 2px solid #555;
      width: 20px;
      height: 20px;
      cursor: pointer;
      display: grid;
      place-content: center;
    }

    input[type="checkbox"]:hover {
      background-color: #949ba6;
    }

    input[type="checkbox"]:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }

    /* The small filled circle */
    input[type="checkbox"]::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #555;

      transform: scale(0);
      transition: transform 120ms ease-in-out;
    }

    /* Show the circle when checked */
    input[type="checkbox"]:checked::before {
      transform: scale(1);
    }

    #smartTurnRow {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    #err {
      color: #f87171;
      min-height: 20px;
      margin-top: 8px;
      max-width: 24rem;
    }

    #dbg {
      opacity: .45;
      font-size: 12px;
      margin-top: 12px;
      font-family: ui-monospace, monospace;
    }

    #voiceRow {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    #voiceRow button {
      margin-top: 0;
    }

    #voiceRow select {
      padding: 9px;
      font-size: 16px;
      border-radius: 8px;
      border: 0;
      cursor: pointer;
      background: #eee;
      line-height: 1.1;
      max-width: 16rem;
      /* the TTS voice list has long entries — keep the row tidy */
    }

    #voiceRow small {
      font-size: 13px;
      font-family: ui-monospace, monospace;
      color: #93c5fd;
    }

    #bgRow {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    #bgRow label {
      font-size: 13px;
      margin-left: 10px;
    }

    #bgRow input[type="range"] {
      width: 110px;
      accent-color: #93c5fd;
    }

    #bgRow output {
      display: inline-block;
      min-width: 3.2em;
      text-align: right;
    }

    #bgRow select {
      margin-top: 24px;
      padding: 9px;
      font-size: 16px;
      border-radius: 8px;
      border: 0;
      cursor: pointer;
      background: #eee;
      line-height: 1.1;
    }

    #sttRow {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      row-gap: 8px;
      justify-content: center;
      align-items: center;
      margin-top: 40px;
      border-top: 1px solid #333;
      padding-top: 20px;
    }

    /* rev-11: model + API key sit on a second line under the endpoint. */
    #sttCfgRow {
      flex-basis: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    /* Shared box look for the STT text controls (rev-11). */
    #sttEndpoint,
    #sttModel,
    #sttApiKey {
      appearance: none;
      border-radius: 10px;
      border: 1px solid #ddd;
      height: 40px;
      padding-left: 5px;
      background-color: #eee;
      font-size: 16px;
      cursor: text;
    }

    #sttEndpoint {
      width: 300px;
      margin-left: 17px;
    }

    /* The mode select keeps its native dropdown arrow (no appearance: none). */
    #sttMode {
      height: 40px;
      padding: 0 5px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background-color: #eee;
      font-size: 16px;
      cursor: pointer;
    }

    #sttModel {
      width: 260px;
    }

    #sttApiKey {
      width: 150px;
    }

    /* Model is irrelevant in stub mode — WP-2 toggles disabled with the mode. */
    #sttModel:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #log {
      margin-top: 14px;
      font-size: 13px;
      font-family: ui-monospace, monospace;
      text-align: left;
      max-height: 10rem;
      overflow-y: auto;
      color: #e5e9ef;
    }

    #log .err {
      color: #f87171;
    }
  </style>
  <!-- Pinned CDN runtime libs (D1) — register globals `ort` and `vad`; read only
     inside src/vad/silero-vad-adapter.js. -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/bundle.min.js"></script>
</head>

<body>
  <div class="card">
    <div id="dot"></div>
    <div id="label" aria-live="polite">press start</div>
    <button id="start" aria-pressed="false">Start microphone</button>

    <div id="smartTurnRow" class="row">
      <input type="checkbox" id="smartTurn">
      <label style="font-size:13px;">
        Smart Turn (+8 MB, semantic end-of-turn)
      </label>
    </div>

    <div id="err"></div>
    <div id="dbg"></div>
    <div style="border-top: 1px solid #666; padding-top: 10px;">Add noise</div>
    <div id="voiceRow">
      <button id="voice" aria-pressed="false">Start computer voice</button>
      <select id="voiceSrc" aria-label="Voice source">
        <option value="synth" selected>speechSynthesis</option>
        <option value="routed">audio buffer (routed)</option>
      </select>
      <select id="ttsVoice" aria-label="Speech synthesis voice">
        <option value="" selected>system default</option>
      </select>
      <small id="voiceNote"></small>
    </div>
    <div id="bgRow">
      <select id="bgSound" aria-label="Background sound">
        <option value="./assets/street-protest.mp3">Street Protest</option>
        <option value="./assets/crowd.mp3">Crowd</option>
        <option value="./assets/street-sounds.mp3">Street Sounds</option>
        <option value="./assets/playground.mp3">Playground</option>
        <option value="./assets/street-sounds-people-talking.mp3">Street Sounds With People Talking</option>
      </select>

      <div>
        <button id="bgToggle" aria-pressed="false">Start background sound</button>
        <label for="bgVolume">Volume <output id="bgVolumeValue" for="bgVolume">50 %</output></label>
        <input id="bgVolume" type="range" min="0" max="100" step="1" value="50">
      </div>
    </div>

    <div id="sttRow" hidden class="row">
      <input type="checkbox" id="transcribe">
      <label style="font-size:13px">transcribe turns</label>
      <select id="sttMode" aria-label="STT backend mode">
        <option value="openai" selected>OpenAI-compatible (multipart)</option>
        <option value="stub">Stub (WAV body → JSON)</option>
      </select>
      <input id="sttEndpoint" value="http://localhost:6000/transcribe"
        placeholder="STT endpoint URL — stub: POST WAV → JSON · openai: …/v1/audio/transcriptions" size="30">
      <div id="sttCfgRow">
        <input id="sttModel" type="text" aria-label="STT model id (OpenAI-compatible mode)"
          placeholder="model id (e.g. mlx-community/parakeet-tdt-0.6b-v3)" size="26" disabled autocomplete="off">
        <input id="sttApiKey" type="password" aria-label="STT API key (optional)" placeholder="API key (optional)"
          size="14" autocomplete="off">
      </div>
    </div>
    <div id="log"></div>
  </div>
  <!-- Version query busts the stale module cache while the dev server sends no
       Cache-Control header. Bump it when demo/main.js changes. -->
  <script type="module" src="./main.js?v=6"></script>
</body>

</html>
