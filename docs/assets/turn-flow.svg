<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">From microphone audio to conversational turns</title>
  <desc id="desc">Silero speech detection feeds a turn detector. The detector emits speech start, turn end with audio, or interruption while an agent speaks. An optional semantic model can hold a candidate turn end.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1927"/><stop offset="1" stop-color="#12283b"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".24"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#80b6c9"/></marker>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <text x="52" y="61" fill="#e7f6fb" font-family="system-ui,sans-serif" font-size="27" font-weight="700">From speech activity to a useful turn</text>
  <text x="52" y="91" fill="#9fc1cf" font-family="system-ui,sans-serif" font-size="15">The classifier hears speech. The turn layer decides when your agent should listen, answer, or stop talking.</text>

  <g font-family="system-ui,sans-serif" filter="url(#shadow)">
    <rect x="48" y="146" width="205" height="155" rx="18" fill="#18364a" stroke="#406479"/>
    <rect x="292" y="146" width="205" height="155" rx="18" fill="#18364a" stroke="#406479"/>
    <rect x="536" y="132" width="300" height="183" rx="18" fill="#1a4556" stroke="url(#accent)" stroke-width="2"/>
    <rect x="880" y="146" width="272" height="155" rx="18" fill="#18364a" stroke="#406479"/>
  </g>
  <g font-family="system-ui,sans-serif">
    <text x="69" y="181" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="1">INPUT</text>
    <text x="69" y="213" fill="#f3fbff" font-size="22" font-weight="700">Microphone</text>
    <text x="69" y="240" fill="#b5cfdb" font-size="15">Browser capture</text>
    <text x="69" y="263" fill="#b5cfdb" font-size="15">AEC requested</text>

    <text x="313" y="181" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="1">SENSOR</text>
    <text x="313" y="213" fill="#f3fbff" font-size="22" font-weight="700">Silero VAD</text>
    <text x="313" y="240" fill="#b5cfdb" font-size="15">Speech probability</text>
    <text x="313" y="263" fill="#b5cfdb" font-size="15">+ 32 ms audio frames</text>

    <text x="557" y="168" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="1">TURN DECISION LAYER</text>
    <text x="557" y="204" fill="#f3fbff" font-size="24" font-weight="700">Speak Or No Speak</text>
    <text x="557" y="233" fill="#c3e0e9" font-size="15">Confirm onset · preserve audio</text>
    <text x="557" y="257" fill="#c3e0e9" font-size="15">Track pauses · adapt end timing</text>
    <text x="557" y="281" fill="#c3e0e9" font-size="15">Detect barge-in during agent audio</text>

    <text x="901" y="181" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="1">YOUR APP</text>
    <text x="901" y="212" fill="#f3fbff" font-size="18" font-weight="700">onSpeechStart</text>
    <text x="901" y="239" fill="#f3fbff" font-size="18" font-weight="700">onTurnEnd + audio</text>
    <text x="901" y="266" fill="#f3fbff" font-size="18" font-weight="700">onInterrupt</text>
  </g>
  <g fill="none" stroke="#80b6c9" stroke-width="3" marker-end="url(#arrow)">
    <path d="M258 223 H282"/><path d="M502 223 H526"/><path d="M842 223 H870"/>
  </g>
  <g font-family="system-ui,sans-serif">
    <rect x="537" y="348" width="299" height="57" rx="13" fill="#18364a" stroke="#416779" stroke-dasharray="5 5"/>
    <text x="557" y="372" fill="#d8eef4" font-size="15" font-weight="700">Optional Smart Turn</text>
    <text x="557" y="393" fill="#a9c9d5" font-size="13">Checks candidate end for completeness</text>
    <path d="M685 316 V342" stroke="#80b6c9" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="49" y="389" fill="#8facbc" font-size="13">Silero engine failure → reported energy VAD fallback</text>
  </g>
</svg>
