<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speak Or No Speak — demo (prebuilt IIFE bundle · docs mode 3)</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #9ca3af;
      color: #eee;
    }

    .card {
      text-align: center;
    }

    #dot {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 16px;
      background: #f59e0b;
      transition: background 150ms;
    }

    body.listening #dot {
      background: #22c55e;
    }

    #label {
      font-size: 28px;
    }

    #meta {
      font-size: 13px;
      color: #93c5fd;
      margin-top: 6px;
      font-family: ui-monospace, monospace;
    }

    button {
      margin-top: 24px;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: 0;
      cursor: pointer;
    }

    input[type="checkbox"] {
      appearance: none;
      border-radius: 20px;
      border: 2px solid #555;
      width: 20px;
      height: 20px;
      cursor: pointer;
      display: grid;
      place-content: center;
    }

    input[type="checkbox"]:hover {
      background-color: #949ba6;
    }

    input[type="checkbox"]:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }

    /* The small filled circle */
    input[type="checkbox"]::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #555;

      transform: scale(0);
      transition: transform 120ms ease-in-out;
    }

    /* Show the circle when checked */
    input[type="checkbox"]:checked::before {
      transform: scale(1);
    }

    #smartTurnRow {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    #err {
      color: #f87171;
      min-height: 20px;
      margin-top: 8px;
      max-width: 24rem;
    }

    #dbg {
      opacity: .45;
      font-size: 12px;
      margin-top: 12px;
      font-family: ui-monospace, monospace;
    }

    #voiceRow {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    #voiceRow button {
      margin-top: 0;
    }

    #voiceRow select {
      padding: 9px;
      font-size: 16px;
      border-radius: 8px;
      border: 0;
      cursor: pointer;
      background: #eee;
      line-height: 1.1;
      max-width: 16rem; /* the TTS voice list has long entries — keep the row tidy */
    }

    #voiceRow small {
      font-size: 13px;
      font-family: ui-monospace, monospace;
      color: #93c5fd;
    }

    #bgRow {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    #bgRow label {
      font-size: 13px;
      margin-left: 10px;
    }

    #bgRow input[type="range"] {
      width: 110px;
      accent-color: #93c5fd;
    }

    #bgRow output {
      display: inline-block;
      min-width: 3.2em;
      text-align: right;
    }

    #bgRow select {
      margin-top: 24px;
      padding: 9px;
      font-size: 16px;
      border-radius: 8px;
      border: 0;
      cursor: pointer;
      background: #eee;
      line-height: 1.1;
    }

    #log {
      margin-top: 14px;
      font-size: 13px;
      font-family: ui-monospace, monospace;
      text-align: left;
      max-height: 10rem;
      overflow-y: auto;
      color: #9ca3af;
    }

    #log .err {
      color: #f87171;
    }
  </style>
  <!-- Pinned CDN runtime libs (docs §4.4) — register the globals `ort` and
       `vad`, read by the Silero engine adapter at start() time. -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/bundle.min.js"></script>
  <!-- The prebuilt IIFE bundle: a classic <script>, no modules — it defines
       the global window.SpeakOrNoSpeak (docs §4.4). Blocking scripts in <head>
       guarantee it is loaded before the inline script in <body> runs. -->
  <script src="https://cdn.jsdelivr.net/gh/zushicat/speak-or-no-speak-dev/build/speak-or-no-speak.iife.js"></script>
</head>

<body>
  <div class="card">
    <div id="dot"></div>
    <div id="label" aria-live="polite">press start</div>
    <div id="meta"></div>
    <button id="start" aria-pressed="false">Start microphone</button>

    <div id="smartTurnRow" class="row">
      <input type="checkbox" id="smartTurn">
      <label style="font-size:13px;">
        Smart Turn (+8 MB, semantic end-of-turn)
      </label>
    </div>

    <div id="err"></div>
    <div id="dbg"></div>
    <div id="voiceRow">
      <button id="voice" aria-pressed="false">Start computer voice</button>
      <select id="voiceSrc" aria-label="Voice source">
        <option value="synth" selected>speechSynthesis</option>
        <option value="routed">audio buffer (routed)</option>
      </select>
      <select id="ttsVoice" aria-label="Speech synthesis voice">
        <option value="" selected>system default</option>
      </select>
      <small id="voiceNote"></small>
    </div>
    <div id="bgRow">
      <select id="bgSound" aria-label="Background sound">
        <option value="./assets/street-protest.mp3">Street Protest</option>
        <option value="./assets/crowd.mp3">Crowd</option>
        <option value="./assets/street-sounds.mp3">Street Sounds</option>
        <option value="./assets/playground.mp3">Playground</option>
        <option value="./assets/street-sounds-people-talking.mp3">Street Sounds With People Talking</option>
      </select>

      <div>
        <button id="bgToggle" aria-pressed="false">Start background sound</button>
        <label for="bgVolume">Volume <output id="bgVolumeValue" for="bgVolume">50 %</output></label>
        <input id="bgVolume" type="range" min="0" max="100" step="1" value="50">
      </div>
    </div>
    <div id="log"></div>
  </div>

  <!--
    demo-iife-bundle.html — docs/04-embedding.md §4.4 "Mode 3 — prebuilt IIFE
    bundle (classic script, no modules)"

    UI and wiring are IDENTICAL to demos/simple-demos/index.html +
    demos/simple-demos/main.js — same
    elements, same behavior (except the demo's STT row, removed in this
    copy — no transcription wiring). The ONLY difference is where the library
    code comes from: the prebuilt minified bundle loaded from the jsDelivr
    <script> tag above,
    loaded as a classic <script> that defines window.SpeakOrNoSpeak — no
    type="module", no import statements.

    Run it (secure context required — file:// will not work):
        npm start        # python3 -m http.server 5173, serves the checkout root
        open http://localhost:5173/demos/simple-demos/demo-iife-bundle.html

    The src "../../build/speak-or-no-speak.iife.js" is relative because this page
    is served from the checkout (demos/simple-demos/ → ../../build/). Copied next to your page
    it is "./speak-or-no-speak.iife.js" (docs §4.4). Once the GitHub repo
    (github.com/zushicat/speak-or-no-speak-dev) is public, an absolute URL works
    as well — GitHub Pages or jsDelivr's GitHub mirror:
        https://cdn.jsdelivr.net/gh/zushicat/speak-or-no-speak-dev@<tag>/build/speak-or-no-speak.iife.js
    (hosting options + MIME/CORS facts: plans/rev-5/explain-rev-5.md §5).

    Sibling page: demo-esm-bundle.html (docs §4.3 — <script type="module">).
    Query param: ?noaec=1 forces echoCancellation off (docs WP5 §5.4).
  -->

  <!-- The entire consumer code — no modules, the global is the whole API. -->
  <script>
    const bundle = window.SpeakOrNoSpeak;

    if (!bundle) {
      // The bundle <script> failed (404 / wrong server root): render, never throw.
      document.getElementById("label").textContent = "bundle failed to load";
      document.getElementById("err").textContent =
        "window.SpeakOrNoSpeak is missing — the IIFE bundle did not load. Serve " +
        "the checkout root (npm start → http://localhost:5173/demos/simple-demos/demo-iife-bundle.html) " +
        "and make sure build/speak-or-no-speak.iife.js exists (npm run build:bundle).";
    } else {
      // The named exports this demo still uses — just reached through the
      // global instead of an import.
      const { createSpeakOrNoSpeak, humanMessage, SmartTurnModel, createAgentAudioRoute } = bundle;

      document.getElementById("meta").textContent =
        "mode 3 · IIFE · jsDelivr build → window.SpeakOrNoSpeak";

      const button = document.getElementById("start");
      const label = document.getElementById("label");
      const errEl = document.getElementById("err");
      const dbg = document.getElementById("dbg");
      const smartTurn = document.getElementById("smartTurn");
      const logEl = document.getElementById("log");
      const bgSound = document.getElementById("bgSound");
      const bgToggle = document.getElementById("bgToggle");
      const bgVolume = document.getElementById("bgVolume");
      const bgVolumeValue = document.getElementById("bgVolumeValue");
      const voice = document.getElementById("voice");
      const voiceSrc = document.getElementById("voiceSrc");
      const ttsVoice = document.getElementById("ttsVoice");
      const voiceNote = document.getElementById("voiceNote");

      let sons = null;
      let micRunning = false;
      let micBusy = false;

      /** Cached across start/stop cycles — the ONNX session loads once. */
      let smartTurnModel = null;

      // Computer voice (rev-9) — start/stop button + voice-source select.
      const synth = window.speechSynthesis;
      const utterance = new SpeechSynthesisUtterance("Hello. I am happy that you talk to me. Tell me about your day. What have you been up to?");

      let voiceRunning = false;
      let route = null;        // created at mic start (user gesture), stopped at mic stop
      let routedSource = null; // active AudioBufferSourceNode (loop mode)
      let voiceBuffer = null;  // decoded agent-voice-sample.wav (decoded once)

      /** One looping media element for the ambient background bed. */
      const bgAudio = new Audio();
      bgAudio.loop = true;
      bgAudio.preload = "auto";
      let bgPlaying = false;
      let bgBusy = false;
      let bgTrack = "";

      /** Timestamped event log (barge-ins, background-sound errors). */
      function logLine(text, isError = false) {
        const line = document.createElement("div");
        if (isError) line.className = "err";
        line.textContent = `${new Date().toISOString().slice(11, 23)} ${text}`;
        logEl.prepend(line);
        while (logEl.children.length > 20) logEl.lastChild.remove();
      }

      // -------------------------------------------------------------------------
      // Background sound (ambient noise — deliberately NOT setAgentSpeaking: it
      // is supposed to reach the detector so the demo can be tested under noise).
      // -------------------------------------------------------------------------

      /** Map the 0–100 slider to the media element's linear 0–1 volume. */
      function syncBgVolume() {
        const percent = Number(bgVolume.value);
        bgAudio.volume = percent / 100;
        bgVolumeValue.textContent = `${percent} %`;
      }

      /** Rewind only when metadata is available: setting currentTime at
       *  readyState HAVE_NOTHING throws in Chromium. */
      function rewindBackground() {
        if (bgAudio.readyState > 0) bgAudio.currentTime = 0;
      }

      function setBgUi(playing) {
        bgPlaying = playing;
        bgToggle.textContent = playing ? "Stop background sound" : "Start background sound";
        bgToggle.setAttribute("aria-pressed", String(playing));
      }

      async function startBackground() {
        if (bgPlaying || bgBusy) return;
        const src = bgSound.value;
        if (!src) return;
        bgBusy = true;
        bgToggle.disabled = true;
        bgSound.disabled = true;
        try {
          if (bgTrack !== src) {
            bgTrack = src;
            bgAudio.src = src;
          }
          rewindBackground();
          syncBgVolume();
          await bgAudio.play();
          setBgUi(true);
        } catch (err) {
          setBgUi(false);
          logLine(`Background sound failed: ${err?.message ?? err}`, true);
        } finally {
          bgBusy = false;
          bgToggle.disabled = false;
          bgSound.disabled = false;
        }
      }

      function stopBackground() {
        bgAudio.pause();
        rewindBackground();
        setBgUi(false);
      }

      // -------------------------------------------------------------------------
      // Microphone start/stop toggle
      // -------------------------------------------------------------------------

      async function toggleMicrophone() {
        if (micBusy) return;
        if (micRunning) {
          stopMicrophone();
          return;
        }
        micBusy = true;
        button.disabled = true;
        try {
          await startMicrophone();
        } finally {
          micBusy = false;
          button.disabled = false;
        }
      }

      async function startMicrophone() {
        errEl.textContent = "";
        label.textContent = "starting…";

        // WP5 §5.4: `?noaec=1` forces echoCancellation off to exercise the
        // no-AEC fallback branch on any machine.
        const forceNoAec = new URLSearchParams(location.search).has("noaec");
        const mic = forceNoAec ? { echoCancellation: false } : undefined;

        // WP8: optional semantic end-of-turn model (checkbox; +8 MB asset). One
        // instance is cached so start/stop cycles do not reload the ONNX session.
        if (smartTurn.checked && !smartTurnModel) smartTurnModel = new SmartTurnModel();

        let instance = null;
        try {
          instance = await createSpeakOrNoSpeak({
            mic,
            turnModel: smartTurn.checked ? smartTurnModel : undefined,
            onSpeechStart: () => {
              document.body.classList.add("listening");
              label.textContent = "listening";
            },
            onTurnEnd: (e) => {
              document.body.classList.remove("listening");
              label.textContent = "not listening";
              // turn-finished log line (WP2 behavior spec)
              dbg.textContent = `turn: ${(e.durationMs / 1000).toFixed(1)} s` +
                (e.truncated ? " (truncated)" : "") + (e.afterInterrupt ? " (after interrupt)" : "");
            },
            // S3 (WP5): kept for completeness; the demo no longer drives TTS.
            onInterrupt: (info) => {
              dbg.textContent = `interrupt after ${info.atMs} ms (latency ${info.latencyMs} ms)`;
              logLine(`barge-in after ${info.atMs} ms (latency ${info.latencyMs} ms)`);
            },
            onLevel: () => { },
            onError: onError,
            debug: false,
          });
          await instance.start();
          sons = instance;
          window.__sons = instance; // debug handle (tooling)
          micRunning = true;
          button.textContent = "Stop microphone";
          button.setAttribute("aria-pressed", "true");
          smartTurn.disabled = true;
          label.textContent = "not listening";
          if (forceNoAec || instance.degraded.aec) {
            errEl.textContent = humanMessage("no-aec");
          }
          if (instance.degraded.engine === "energy") {
            errEl.textContent = humanMessage("engine-fallback");
          }

          // WP-E2: cancelable agent-audio route — created HERE inside the
          // mic-start click (user gesture, R2), reused while the mic runs,
          // stopped on mic stop. Fail-soft (R3): plain playback + stricter
          // gating stay active if the loopback cannot be built. `?routemode=`
          // forces loopback|direct (test hook, D7).
          if (typeof createAgentAudioRoute === "function") {
            try {
              const forced = new URLSearchParams(location.search).get("routemode");
              route = await createAgentAudioRoute(forced ? { mode: forced } : {});
              instance.setAgentAudioRouted(true);
              instance.setAgentAudioReference(route);
              voiceNote.textContent = ` · route: ${route.mode}`;
            } catch (routeErr) {
              route = null;
              errEl.textContent += ` · agent-audio route failed: ${routeErr?.message ?? routeErr}`;
            }
          } else {
            voiceNote.textContent = " · route: n/a (bundle without createAgentAudioRoute)";
          }
        } catch (err) {
          // onError may already have rendered the message; otherwise show it here.
          try { instance?.stop(); } catch { /* already torn down */ }
          sons = null;
          window.__sons = null;
          micRunning = false;
          button.textContent = "Start microphone";
          button.setAttribute("aria-pressed", "false");
          smartTurn.disabled = false;
          label.textContent = "press start";
          if (!errEl.textContent) {
            errEl.textContent = err?.code
              ? humanMessage(err.code)
              : `Error: ${err?.message ?? err}`;
          }
        }
      }

      function stopMicrophone() {
        try {
          sons?.setAgentAudioRouted(false); // D5: route declaration is per-session
        } catch { /* already torn down */ }
        try {
          sons?.stop();
        } catch (err) {
          logLine(`stop failed: ${err?.message ?? err}`, true);
        }
        sons = null;
        window.__sons = null;
        micRunning = false;
        document.body.classList.remove("listening");
        button.textContent = "Start microphone";
        button.setAttribute("aria-pressed", "false");
        smartTurn.disabled = false;
        label.textContent = "press start";
        dbg.textContent = "";
        errEl.textContent = "";
        voiceNote.textContent = "";
        stopComputerVoice();
        const r = route;
        route = null;
        r?.stop().catch(() => { /* teardown is best-effort */ });
      }

      function onError(err) {
        errEl.textContent = humanMessage(err.code) ?? `Error (${err.code}): ${err.message}`;
        // eslint-disable-next-line no-console
        console.error("[sons] onError:", err);
      }

      // Computer voice — two sources (WP-E2):
      //   speechSynthesis: today's default; NOT cancelable on Chrome/Edge
      //     without `echoCancellation: "all"` + OS permission (F7 — cannot be
      //     captured into the AEC reference).
      //   audio buffer (routed): plays ./assets/agent-voice-sample.wav through
      //     the cancelable agent-audio route (createAgentAudioRoute) — the
      //     browser classifies it as "remote participant" audio and cancels it
      //     (D6/D8).
      //   voice dropdown (ttsVoice): the system TTS voices from
      //     speechSynthesis.getVoices() — applies to the synth source only.
      const VOICE_SAMPLE_URL = "./assets/agent-voice-sample.wav";

      function setVoiceUi(running) {
        voiceRunning = running;
        voice.textContent = running ? "Stop computer voice" : "Start computer voice";
        voice.setAttribute("aria-pressed", String(running));
      }

      async function ensureVoiceBuffer() {
        if (voiceBuffer) return voiceBuffer;
        const res = await fetch(VOICE_SAMPLE_URL);
        if (!res.ok) throw new Error(`voice sample fetch failed (${res.status})`);
        const ab = await res.arrayBuffer();
        const decodeCtx = new AudioContext(); // one-off decode (route ctx is private by contract)
        try { voiceBuffer = await decodeCtx.decodeAudioData(ab); }
        finally { decodeCtx.close().catch(() => {}); }
        return voiceBuffer;
      }

      async function playRoutedVoice() {
        if (!route) throw new Error("route not ready — start the microphone first (the route is created in that click)");
        const buffer = await ensureVoiceBuffer();
        const src = route.input.context.createBufferSource();
        src.buffer = buffer;
        src.loop = true;
        src.connect(route.input); // the ONLY wiring (D8) — never also to ctx.destination
        src.start();
        routedSource = src;
      }

      function stopRoutedVoice() {
        try { routedSource?.stop(); } catch { /* already stopped */ }
        routedSource = null;
      }

      function stopComputerVoice() {
        setVoiceUi(false);
        synth.cancel();
        stopRoutedVoice();
      }

      async function toggleComputerVoice() {
        if (voiceRunning) {
          stopComputerVoice();
          return;
        }
        setVoiceUi(true);

        if (voiceSrc.value === "routed") {
          try {
            await playRoutedVoice();
          } catch (err) {
            setVoiceUi(false);
            errEl.textContent = `Routed voice failed: ${err?.message ?? err}`;
          }
        } else {
          applySelectedVoice(utterance);
          synth.speak(utterance);
        }
      }

      /** Apply the TTS voice picked in the voice dropdown (unset = system
       *  default). The utterance must get the SpeechSynthesisVoice OBJECT —
       *  looked up from the live getVoices() list at speak time. */
      function applySelectedVoice(u) {
        const selected = ttsVoice.value
          ? synth.getVoices().find((v) => v.voiceURI === ttsVoice.value)
          : null;
        u.voice = selected ?? null;
        u.lang = selected ? selected.lang : ""; // "" = user-agent default language
      }

      /** Populate the voice dropdown from speechSynthesis.getVoices() — the
       *  list arrives async in Chrome (voiceschanged) and can change; the
       *  user's choice survives repopulation. */
      function populateTtsVoices() {
        const voices = synth.getVoices();
        if (!voices.length) return;
        const previous = ttsVoice.value;
        ttsVoice.textContent = "";
        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.textContent = "system default";
        ttsVoice.appendChild(defaultOption);
        for (const v of voices) {
          const option = document.createElement("option");
          option.value = v.voiceURI;
          option.textContent = `${v.name} (${v.lang})`;
          ttsVoice.appendChild(option);
        }
        if ([...ttsVoice.options].some((o) => o.value === previous)) ttsVoice.value = previous;
      }
      populateTtsVoices();
      synth.addEventListener("voiceschanged", populateTtsVoices);

      // -------------------------------------------------------------------------
      // Wiring
      // -------------------------------------------------------------------------

      button.addEventListener("click", toggleMicrophone);
      voice.addEventListener("click", toggleComputerVoice);

      bgToggle.addEventListener("click", () => {
        if (bgPlaying) stopBackground();
        else startBackground();
      });

      bgSound.addEventListener("change", () => {
        if (!bgPlaying) return;
        stopBackground();
        startBackground();
      });

      bgVolume.addEventListener("input", syncBgVolume);
      syncBgVolume();

      bgAudio.addEventListener("error", () => {
        setBgUi(false);
        logLine(`Background sound failed to load: ${bgAudio.error?.message ?? "unknown media error"}`, true);
      });

      // Release the mic and stop audio when the page is left (reload / bfcache).
      window.addEventListener("pagehide", () => {
        stopMicrophone();
        stopBackground();
      });
    }
  </script>
</body>

</html>
